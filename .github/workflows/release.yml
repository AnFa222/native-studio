name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release -V --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stage portable application
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix package
          windeployqt --release --no-translations "package/bin/Native Studio.exe"
          Compress-Archive -Path package/* -DestinationPath NativeStudio-Windows-x64.zip
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NativeStudio-Windows-x64.zip
            build/plugins/languages/language_cpp.dll
            build/plugins/languages/language_python.dll
            build/extensions/bundled/native_git.dll
            build/extensions/bundled/native_git.json
            build/extensions/bundled/native_code_tidy.dll
            build/extensions/bundled/native_code_tidy.json
            build/extensions/store/native_python_debugger.dll
            build/extensions/store/native_python_debugger.json
            src/extension_api.h
            src/EXTENSION_ABI.md
